# Included from every location block on purpose: nginx only inherits add_header
# directives while the current level declares none of its own, so a location
# that sets Cache-Control would otherwise silently drop these.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
